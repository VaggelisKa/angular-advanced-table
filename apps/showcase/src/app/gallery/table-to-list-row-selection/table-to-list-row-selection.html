<main class="showcase-page sc-demo-page">
  <app-demo-code [css]="exampleCss" [markup]="exampleMarkup" [typescript]="exampleTs">
    <section aria-label="Demo controls" class="demo-controls">
      <div aria-label="Selection mode" class="control-group" role="group">
        <button
          [attr.aria-pressed]="selectionMode() === 'multiple'"
          [class.is-active]="selectionMode() === 'multiple'"
          data-testid="selection-mode-multiple"
          type="button"
          (click)="setSelectionMode('multiple')">
          Multiple
        </button>
        <button
          [attr.aria-pressed]="selectionMode() === 'single'"
          [class.is-active]="selectionMode() === 'single'"
          data-testid="selection-mode-single"
          type="button"
          (click)="setSelectionMode('single')">
          Single
        </button>
      </div>

      <div class="control-group" role="group">
        <button data-testid="clear-selection" type="button" (click)="clearSelection()">Clear selection</button>
      </div>

      <p aria-live="polite" class="selection-readout" data-testid="selected-count">{{ selectedCount() }} selected</p>
    </section>

    <nat-table-surface [(state)]="state">
      <nat-list
        [columns]="columns"
        [data]="rows"
        [enableRowSelection]="true"
        [getRowId]="getRowId"
        [selectionMode]="selectionMode()"
        accessibleName="Orders list with row selection"
        class="sc-demo-list" />
    </nat-table-surface>
  </app-demo-code>
</main>
