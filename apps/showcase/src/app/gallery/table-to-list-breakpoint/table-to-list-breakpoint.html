<main class="showcase-page sc-demo-page">
  <app-demo-code [css]="exampleCss" [markup]="exampleMarkup" [typescript]="exampleTs">
    <nat-table-surface [enableSorting]="true" [(state)]="state">
      @if (isTableViewport()) {
        <nat-table
          [columns]="columns"
          [data]="rows"
          [getRowId]="getRowId"
          accessibleName="Orders table for tablet viewports and up"
          class="sc-demo-table" />
      } @else {
        <nat-list
          [columns]="columns"
          [data]="rows"
          [getRowId]="getRowId"
          accessibleName="Orders list for narrow viewports"
          class="sc-demo-list" />
      }
    </nat-table-surface>
  </app-demo-code>
</main>
