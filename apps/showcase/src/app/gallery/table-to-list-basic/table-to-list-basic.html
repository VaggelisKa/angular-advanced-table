<main class="showcase-page sc-demo-page">
  <p class="demo-hint">
    The smallest list composition: a surface for the state scope and the list itself — no table involved. Fields render stacked in
    column order with labels resolved from the column defs.
  </p>

  <section aria-label="Minimal code example" class="demo-code">
    <h2 class="demo-code-title">Minimal example</h2>
    <pre class="demo-code-block"><code>{{ exampleCode }}</code></pre>
  </section>

  <nat-table-surface>
    <nat-list [columns]="columns" [data]="rows" [getRowId]="getRowId" accessibleName="Orders list" class="sc-demo-list" />
  </nat-table-surface>
</main>
