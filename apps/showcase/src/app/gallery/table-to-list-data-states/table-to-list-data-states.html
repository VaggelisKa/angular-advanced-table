<main class="showcase-page sc-demo-page">
  <app-demo-code [css]="exampleCss" [markup]="exampleMarkup" [typescript]="exampleTs">
    <section aria-label="Demo controls" class="demo-controls">
      <div aria-label="Data scenario" class="control-group" role="group">
        @for (demoScenario of scenarios; track demoScenario.id) {
          <button
            [attr.aria-pressed]="scenario() === demoScenario.id"
            [class.is-active]="scenario() === demoScenario.id"
            type="button"
            (click)="scenario.set(demoScenario.id)">
            {{ demoScenario.label }}
          </button>
        }
      </div>
    </section>

    <nat-table-surface>
      <nat-list
        [columns]="columns"
        [data]="rows()"
        [dataStatus]="dataStatus()"
        [getRowId]="getRowId"
        accessibleName="Orders list with data lifecycle states"
        class="sc-demo-list" />
    </nat-table-surface>
  </app-demo-code>
</main>
