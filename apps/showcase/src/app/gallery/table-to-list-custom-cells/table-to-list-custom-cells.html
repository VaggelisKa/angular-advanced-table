<main class="showcase-page sc-demo-page">
  <app-demo-code [markup]="exampleMarkup" [typescript]="exampleTs">
    <ng-template #totalTemplate let-context>
      <strong class="template-total" data-testid="template-cell">{{ context.getValue() }} USD</strong>
    </ng-template>

    <nat-table-surface>
      <nat-list
        [columns]="columns()"
        [data]="rows"
        [getRowId]="getRowId"
        accessibleName="Orders list with custom cell rendering"
        class="sc-demo-list" />
    </nat-table-surface>
  </app-demo-code>
</main>
