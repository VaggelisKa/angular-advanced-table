<main class="showcase-page sc-demo-page">
  <app-demo-code [markup]="exampleMarkup" [typescript]="exampleTs">
    <section aria-label="Demo controls" class="demo-controls">
      <div aria-label="View mode" class="control-group" role="group">
        <button
          [attr.aria-pressed]="view() === 'table'"
          [class.is-active]="view() === 'table'"
          data-testid="view-toggle-table"
          type="button"
          (click)="view.set('table')">
          Table
        </button>
        <button
          [attr.aria-pressed]="view() === 'list'"
          [class.is-active]="view() === 'list'"
          data-testid="view-toggle-list"
          type="button"
          (click)="view.set('list')">
          List
        </button>
      </div>
    </section>

    <nat-table-surface [enableSorting]="true" [(state)]="state">
      @if (view() === 'table') {
        <nat-table
          [columns]="tableColumns"
          [data]="rows"
          [getRowId]="getRowId"
          accessibleName="Orders table with the full column config"
          class="sc-demo-table" />
      } @else {
        <nat-list
          [columns]="listColumns"
          [data]="rows"
          [getRowId]="getRowId"
          accessibleName="Orders list with a condensed column config"
          class="sc-demo-list" />
      }
    </nat-table-surface>
  </app-demo-code>
</main>
