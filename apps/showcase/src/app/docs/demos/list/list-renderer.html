<div class="list-demo-controls">
  <app-demo-toggle-group [options]="rendererOptions" [value]="view()" accessibleName="Renderer" (valueChange)="view.set($event)" />

  <button
    [attr.aria-label]="sortByTotalLabel()"
    [class.is-active]="sortDirection() !== null"
    class="btn btn-outline"
    type="button"
    (click)="cycleSortByTotal()">
    Sort by total
    <span aria-hidden="true" class="list-demo-sort-arrow" data-testid="list-demo-sort-arrow">{{ sortArrow() }}</span>
  </button>
</div>

<nat-table-surface [(state)]="state">
  @if (view() === 'list') {
    <nat-list
      [columns]="columns"
      [data]="rows"
      accessibleName="Orders list sharing state with the table renderer"
      class="sc-demo-list list-demo-list" />
  } @else {
    <nat-table
      [columns]="columns"
      [data]="rows"
      accessibleName="Orders table sharing state with the list renderer"
      class="sc-demo-table" />
  }
</nat-table-surface>
