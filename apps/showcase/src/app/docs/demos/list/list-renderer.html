<div class="list-demo-controls">
  <div aria-label="Renderer" class="list-demo-toggle" role="group">
    <button
      [attr.aria-pressed]="view() === 'list'"
      [class.is-active]="view() === 'list'"
      class="btn btn-outline"
      type="button"
      (click)="view.set('list')">
      List
    </button>
    <button
      [attr.aria-pressed]="view() === 'table'"
      [class.is-active]="view() === 'table'"
      class="btn btn-outline"
      type="button"
      (click)="view.set('table')">
      Table
    </button>
  </div>

  <button
    [attr.aria-label]="sortByTotalLabel()"
    [class.is-active]="sortDirection() !== null"
    class="btn btn-secondary"
    type="button"
    (click)="cycleSortByTotal()">
    Sort by total
    <span aria-hidden="true" class="list-demo-sort-arrow" data-testid="list-demo-sort-arrow">{{ sortArrow() }}</span>
  </button>
</div>

@if (view() === 'list') {
  <nat-table-surface [(state)]="state">
    <nat-list
      [columns]="columns"
      [data]="rows"
      accessibleName="Orders list sharing state with the table renderer"
      class="list-demo-list" />
  </nat-table-surface>
} @else {
  <div class="card">
    <h2 class="card-title">Orders</h2>

    <nat-table-surface [(state)]="state">
      <nat-table [columns]="columns" [data]="rows" accessibleName="Orders table sharing state with the list renderer" />
    </nat-table-surface>
  </div>
}
