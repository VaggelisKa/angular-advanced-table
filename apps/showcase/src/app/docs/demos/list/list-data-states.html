<app-demo-toggle-group
  [options]="scenarioOptions"
  [value]="scenario()"
  accessibleName="Data scenario"
  class="demo-controls"
  (valueChange)="scenario.set($event)" />

<nat-table-surface>
  <nat-list
    [columns]="columns"
    [data]="rows()"
    [dataStatus]="dataStatus()"
    accessibleName="Orders across data lifecycle states"
    class="sc-demo-list list-states-list" />
</nat-table-surface>
