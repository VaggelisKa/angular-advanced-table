<app-demo-layout>
  <nat-table-surface [enableSorting]="true" [stickyHeader]="true" class="virtual-scroll-demo-surface">
    <nat-table
      #virtualScroll="natTableVirtualScroll"
      [columns]="columns"
      [data]="data"
      [natTableVirtualScroll]="{ rowHeight: 44 }"
      accessibleName="Virtual scrolling demo table"
      class="sc-demo-table" />
  </nat-table-surface>

  <app-demo-section demoAside heading="Watch the window">
    <app-demo-facts [facts]="facts()" live />

    <button class="btn btn-outline" data-testid="virtual-scroll-jump-middle" type="button" (click)="scrollToRow(2500)">
      Jump to row 2501
    </button>
    <button class="btn btn-outline" data-testid="virtual-scroll-jump-top" type="button" (click)="scrollToRow(0)">
      Back to the top
    </button>

    <p class="demo-note">
      Five thousand rows scroll in a region that only ever mounts the window above — inspect the tbody to watch rows and spacers swap
      as you scroll. Sorting stays live and resets the scroll position because the row order changed.
    </p>
  </app-demo-section>
</app-demo-layout>
