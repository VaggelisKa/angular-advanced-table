<app-demo-layout>
  <nat-table-surface [enablePinning]="true" [enableSorting]="true" [(state)]="tableState" class="pinning-shadow-example">
    <nat-table [columns]="columns" [data]="data" accessibleName="Pinning demo table" class="sc-demo-table" />
  </nat-table-surface>

  <app-demo-section demoAside heading="Configure pinning state">
    @for (column of targetColumns; track column.id) {
      <div [attr.data-testid]="`pinning-column-${column.id}`" class="pinning-column">
        <span class="pinning-column-name">{{ column.label }}</span>
        <app-demo-toggle-group
          [accessibleName]="`Pin ${column.label} column`"
          [options]="pinOptions"
          [value]="getPinnedSide(column.id)"
          (valueChange)="pinColumn(column.id, $event)" />
      </div>
    }
  </app-demo-section>
</app-demo-layout>
