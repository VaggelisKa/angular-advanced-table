<app-demo-layout>
  <nat-table-surface
    [enableColumnResizing]="!isMobile()"
    [enablePinning]="!isMobile()"
    [enableSorting]="!isMobile()"
    [(state)]="tableState">
    <nat-table [columns]="columns()" [data]="data" accessibleName="Responsive capabilities demo table" class="sc-demo-table" />
  </nat-table-surface>

  <app-demo-section demoAside heading="Simulate viewport">
    <app-demo-toggle-group
      [options]="viewportOptions"
      [value]="viewport()"
      accessibleName="Simulated viewport"
      (valueChange)="viewport.set($event)" />

    <button class="btn btn-outline" type="button" (click)="sortByValue()">Sort by Value</button>

    <app-demo-facts [facts]="facts()" live />

    <p class="demo-note">
      Sort buttons, pin menus, and resize handles disappear from the header on mobile, but "Sort by Value" still updates table state
      programmatically. That proves an app-owned sort sheet keeps working while the built-in sort UI is hidden.
    </p>
  </app-demo-section>
</app-demo-layout>
