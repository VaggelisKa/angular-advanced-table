<app-demo-layout>
  <nat-table-surface [enablePinning]="true" [enableSorting]="true" [(state)]="tableState">
    <nat-table [columns]="columns" [data]="data" accessibleName="Sorting demo table" class="sc-demo-table" />
  </nat-table-surface>

  <app-demo-section demoAside heading="Programmatic sort actions">
    <button class="btn btn-outline" type="button" (click)="sortBy('value', 'asc')">Sort by Value (Asc)</button>
    <button class="btn btn-outline" type="button" (click)="sortBy('name', 'desc')">Sort by Name (Desc)</button>
    <button class="btn btn-secondary" type="button" (click)="clearSort()">Clear Sorting</button>

    <app-demo-facts [facts]="sortFacts()" live />
  </app-demo-section>
</app-demo-layout>

<app-demo-layout>
  <nat-table-surface [enableMultiSort]="true" [enablePinning]="true" [enableSorting]="true" [(state)]="multiSortState">
    <nat-table [columns]="columns" [data]="data" accessibleName="Multi-column sorting demo table" class="sc-demo-table" />
  </nat-table-surface>

  <app-demo-section demoAside heading="Sort priority">
    <div class="demo-note">
      <ol>
        <li>Click a header's sort button to sort by that column.</li>
        <li>
          <strong>Shift + click</strong> (or <strong>Shift + Enter</strong> on a focused sort button) adds another column to the sort.
        </li>
        <li>A numbered badge on each sorted header shows its priority.</li>
      </ol>
    </div>

    <app-demo-facts [facts]="multiSortFacts()" live />

    <button class="btn btn-outline" type="button" (click)="applyMultiPreset()">Sort by Category, then Value</button>
    <button class="btn btn-secondary" type="button" (click)="clearMultiSort()">Clear Sorting</button>
  </app-demo-section>
</app-demo-layout>
