name: Release

# Cuts a stable release: consumes the pending `.nx/version-plans/` files,
# writes the changelog and release commit, tags it, and publishes to npm under
# `latest`.
#
# Two triggers, one release path:
#   - schedule — a Friday window, so pending work ships on its own instead of
#     waiting for someone to remember the button. The window opens weekly; the
#     soak gate below decides which of those Fridays actually cuts a release.
#   - workflow_dispatch — the same release on demand, for anything that should
#     not wait for the next scheduled window.
#
# The scheduled run does exactly what the manual one does, but a preflight job
# gates it first, because nobody is watching it: it releases only when there is
# something pending, CI is green on the commit it would ship, AND the pending
# work has soaked in `@next` (see the soak gate below). A manual dispatch stays
# a deliberate act — it skips both gates, and it fails loudly rather than
# silently no-opping when nothing is pending.

on:
  schedule:
    # Fridays at 09:00 UTC, inside the European working day so a failed release
    # is seen the same day. GitHub only runs scheduled workflows from the
    # default branch, and disables them after 60 days without repo activity.
    #
    # This is when a release MAY be cut, not how often one is: most Fridays the
    # soak gate declines, which is what turns a weekly trigger into a slower
    # real cadence. Keeping the trigger weekly also avoids encoding "every
    # other Friday" in cron, which cannot express it — and week-number parity
    # skips or doubles a release on 53-week years such as 2026.
    - cron: '0 9 * * 5'
  workflow_dispatch:

permissions:
  contents: read

env:
  # Soak gate thresholds, in days. A scheduled release waits until the work it
  # would ship has spent RELEASE_SOAK_DAYS in `@next` — measured from the most
  # recent pending change, so a fresh merge restarts the wait.
  #
  # On a repo with steady merges that alone would starve: something new lands
  # before the window closes, every week, forever. RELEASE_MAX_WAIT_DAYS is the
  # backstop — once the OLDEST pending plan is that old, the release goes out
  # regardless. In practice the backstop, not the soak window, is what sets the
  # usual cadence; lower it to release more often.
  RELEASE_SOAK_DAYS: 7
  RELEASE_MAX_WAIT_DAYS: 21

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  preflight:
    name: Check whether there is a release to cut
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read # read CI's conclusion for this commit
    outputs:
      proceed: ${{ steps.decide.outputs.proceed }}

    steps:
      - name: Require main branch
        if: github.ref != 'refs/heads/main'
        run: |
          echo "The Release workflow can only run from the main branch." >&2
          exit 1

      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          # Pin the commit this run reasons about. This is already the default
          # (checkout falls back to `github.sha`), but both jobs state it so the
          # preflight verdict and the released tree provably refer to one sha.
          ref: ${{ github.sha }}
          # The soak gate dates each version plan from its commits, which a
          # shallow clone does not carry.
          fetch-depth: 0
          persist-credentials: false

      - name: Count pending version plans
        id: plans
        run: |
          shopt -s nullglob
          plans=(.nx/version-plans/*.md)
          echo "Pending version plans: ${#plans[@]}"
          echo "count=${#plans[@]}" >> "$GITHUB_OUTPUT"

      # A scheduled release ships whatever `main` points at, so it has to check
      # that commit is green itself. The push-event CI run for this exact sha is
      # the one that validated the tree; anything else (missing, still running,
      # failed) means the commit is unverified and the release waits for the
      # next window — or goes out by hand once CI is sorted.
      - name: Check CI on the commit this would release
        id: ci
        if: github.event_name == 'schedule' && steps.plans.outputs.count != '0'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          conclusion="$(gh api \
            "repos/${GITHUB_REPOSITORY}/actions/workflows/ci.yml/runs?branch=main&head_sha=${GITHUB_SHA}&status=completed&per_page=100" \
            --jq '[.workflow_runs[] | select(.event == "push")] | first | .conclusion // "none"')"
          echo "CI conclusion for ${GITHUB_SHA}: ${conclusion}"
          echo "conclusion=${conclusion}" >> "$GITHUB_OUTPUT"

      # How long the pending work has been available to consumers. Every green
      # commit on main is published to `@next` by nightly.yml, so "landed on
      # main" and "installable as a prerelease" are the same moment — and the
      # version plans stand in faithfully for the changes themselves, since
      # anything touching library behavior, public API, docs, examples, or tests
      # ships with one.
      - name: Measure how long the pending work has soaked
        id: soak
        if: github.event_name == 'schedule' && steps.plans.outputs.count != '0'
        run: |
          shopt -s nullglob
          now="$(date +%s)"
          newest=0
          oldest="$now"

          for plan in .nx/version-plans/*.md; do
            # Newest: the last commit to TOUCH the file, not the one that added
            # it. Follow-up work is folded into the plan that already covers it
            # rather than landing as a second file, so an edit means new code
            # arrived under an old filename — dating it from the add would
            # credit that code with soak time it never had.
            touched="$(git log -1 --format=%ct -- "$plan")"
            # Oldest: when the plan first appeared, which is how long the work
            # it describes has actually been waiting to ship.
            added="$(git log --diff-filter=A -1 --format=%ct -- "$plan")"

            # A plan with no history cannot be dated; treat it as brand new, so
            # an unreadable file delays a release rather than rushing one out.
            : "${touched:=$now}"
            : "${added:=$now}"

            if [ "$touched" -gt "$newest" ]; then newest="$touched"; fi
            if [ "$added" -lt "$oldest" ]; then oldest="$added"; fi
          done

          # No plans matched, so there is nothing to date. The step only runs
          # when there are plans, but fail closed rather than reporting an age
          # of "since the epoch" and waving the release through.
          if [ "$newest" = "0" ]; then newest="$now"; fi

          newest_age=$(( (now - newest) / 86400 ))
          oldest_age=$(( (now - oldest) / 86400 ))
          echo "Newest pending change: ${newest_age}d ago. Oldest pending plan: ${oldest_age}d old."
          echo "newest_age_days=${newest_age}" >> "$GITHUB_OUTPUT"
          echo "oldest_age_days=${oldest_age}" >> "$GITHUB_OUTPUT"

      - name: Decide
        id: decide
        env:
          EVENT: ${{ github.event_name }}
          PLAN_COUNT: ${{ steps.plans.outputs.count }}
          CI_CONCLUSION: ${{ steps.ci.outputs.conclusion }}
          NEWEST_AGE: ${{ steps.soak.outputs.newest_age_days }}
          OLDEST_AGE: ${{ steps.soak.outputs.oldest_age_days }}
        run: |
          skip() {
            echo "proceed=false" >> "$GITHUB_OUTPUT"
            echo "Skipping release: $1"
            echo "**No release cut.** $1" >> "$GITHUB_STEP_SUMMARY"
          }

          if [ "$PLAN_COUNT" = "0" ]; then
            if [ "$EVENT" = "schedule" ]; then
              skip "no pending version plans in \`.nx/version-plans/\` — nothing to release."
              exit 0
            fi
            echo "No pending version plans in .nx/version-plans/ — nothing to release." >&2
            exit 1
          fi

          if [ "$EVENT" = "schedule" ] && [ "$CI_CONCLUSION" != "success" ]; then
            skip "CI on \`${GITHUB_SHA}\` is \`${CI_CONCLUSION}\`, not \`success\` — refusing to release an unverified commit."
            exit 0
          fi

          # Ship once either clock says so: the newest change has soaked, or the
          # oldest has waited long enough that more soaking is just delay.
          if [ "$EVENT" = "schedule" ] \
            && [ "$NEWEST_AGE" -lt "$RELEASE_SOAK_DAYS" ] \
            && [ "$OLDEST_AGE" -lt "$RELEASE_MAX_WAIT_DAYS" ]; then
            skip "newest pending change is ${NEWEST_AGE}d old (soak window ${RELEASE_SOAK_DAYS}d) and the oldest pending plan is ${OLDEST_AGE}d old (backstop ${RELEASE_MAX_WAIT_DAYS}d) — letting it bake in \`@next\`. Dispatch this workflow manually to release now."
            exit 0
          fi

          echo "proceed=true" >> "$GITHUB_OUTPUT"
          echo "Releasing ${PLAN_COUNT} pending version plan(s) from ${GITHUB_SHA}."

  release:
    needs: preflight
    if: needs.preflight.outputs.proceed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write # push the release commit and tags

    steps:
      - name: Require main branch
        if: github.ref != 'refs/heads/main'
        run: |
          echo "The Release workflow can only run from the main branch." >&2
          exit 1

      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          # The exact commit preflight validated — see the preflight checkout.
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Enable Corepack
        run: corepack enable

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: 24
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Validate release preview
        run: pnpm exec nx release --dry-run

      # npm publishes are permanent and the release commit still has to fast-
      # forward `main`. If `main` moved after this run started, the push at the
      # end would be rejected and the version would already be on the registry
      # with no commit, tag, or changelog behind it. Check as late as possible,
      # and fail before publishing rather than after.
      - name: Require main to still be at the validated commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          head="$(gh api "repos/${GITHUB_REPOSITORY}/commits/main" --jq '.sha')"
          if [ "$head" != "$GITHUB_SHA" ]; then
            echo "main moved to ${head} since this run started (validated ${GITHUB_SHA})." >&2
            echo "Refusing to publish a release that could not be pushed. Re-run once main is settled." >&2
            exit 1
          fi
          echo "main is still at ${GITHUB_SHA}."

      - name: Release packages
        run: pnpm exec nx release --yes
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Push release commit and tags
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh auth setup-git
          git push origin HEAD:main --follow-tags
