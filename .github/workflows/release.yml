name: Release

# Cuts a stable release: consumes the pending `.nx/version-plans/` files,
# writes the changelog and release commit, tags it, and publishes to npm under
# `latest`.
#
# Two triggers, one release path:
#   - schedule — every Friday, so pending work ships on a predictable cadence
#     instead of waiting for someone to remember the button.
#   - workflow_dispatch — the same release on demand, for anything that should
#     not wait for Friday.
#
# The scheduled run does exactly what the manual one does, but a preflight job
# gates it first, because nobody is watching it: it releases only when there is
# something pending AND CI is green on the commit it would ship. A manual
# dispatch stays a deliberate act — it skips the CI gate, and it fails loudly
# rather than silently no-opping when nothing is pending.

on:
  schedule:
    # Fridays at 09:00 UTC, inside the European working day so a failed release
    # is seen the same day. GitHub only runs scheduled workflows from the
    # default branch, and disables them after 60 days without repo activity.
    - cron: '0 9 * * 5'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  preflight:
    name: Check whether there is a release to cut
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read # read CI's conclusion for this commit
    outputs:
      proceed: ${{ steps.decide.outputs.proceed }}

    steps:
      - name: Require main branch
        if: github.ref != 'refs/heads/main'
        run: |
          echo "The Release workflow can only run from the main branch." >&2
          exit 1

      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          persist-credentials: false

      - name: Count pending version plans
        id: plans
        run: |
          shopt -s nullglob
          plans=(.nx/version-plans/*.md)
          echo "Pending version plans: ${#plans[@]}"
          echo "count=${#plans[@]}" >> "$GITHUB_OUTPUT"

      # A scheduled release ships whatever `main` points at, so it has to check
      # that commit is green itself. The push-event CI run for this exact sha is
      # the one that validated the tree; anything else (missing, still running,
      # failed) means the commit is unverified and the release waits a week —
      # or goes out by hand once CI is sorted.
      - name: Check CI on the commit this would release
        id: ci
        if: github.event_name == 'schedule' && steps.plans.outputs.count != '0'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          conclusion="$(gh api \
            "repos/${GITHUB_REPOSITORY}/actions/workflows/ci.yml/runs?branch=main&head_sha=${GITHUB_SHA}&status=completed&per_page=100" \
            --jq '[.workflow_runs[] | select(.event == "push")] | first | .conclusion // "none"')"
          echo "CI conclusion for ${GITHUB_SHA}: ${conclusion}"
          echo "conclusion=${conclusion}" >> "$GITHUB_OUTPUT"

      - name: Decide
        id: decide
        env:
          EVENT: ${{ github.event_name }}
          PLAN_COUNT: ${{ steps.plans.outputs.count }}
          CI_CONCLUSION: ${{ steps.ci.outputs.conclusion }}
        run: |
          skip() {
            echo "proceed=false" >> "$GITHUB_OUTPUT"
            echo "Skipping release: $1"
            echo "**No release cut.** $1" >> "$GITHUB_STEP_SUMMARY"
          }

          if [ "$PLAN_COUNT" = "0" ]; then
            if [ "$EVENT" = "schedule" ]; then
              skip "no pending version plans in \`.nx/version-plans/\` — nothing to release."
              exit 0
            fi
            echo "No pending version plans in .nx/version-plans/ — nothing to release." >&2
            exit 1
          fi

          if [ "$EVENT" = "schedule" ] && [ "$CI_CONCLUSION" != "success" ]; then
            skip "CI on \`${GITHUB_SHA}\` is \`${CI_CONCLUSION}\`, not \`success\` — refusing to release an unverified commit."
            exit 0
          fi

          echo "proceed=true" >> "$GITHUB_OUTPUT"
          echo "Releasing ${PLAN_COUNT} pending version plan(s) from ${GITHUB_SHA}."

  release:
    needs: preflight
    if: needs.preflight.outputs.proceed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write # push the release commit and tags

    steps:
      - name: Require main branch
        if: github.ref != 'refs/heads/main'
        run: |
          echo "The Release workflow can only run from the main branch." >&2
          exit 1

      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Enable Corepack
        run: corepack enable

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: 24
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Validate release preview
        run: pnpm exec nx release --dry-run

      - name: Release packages
        run: pnpm exec nx release --yes
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Push release commit and tags
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh auth setup-git
          git push origin HEAD:main --follow-tags
